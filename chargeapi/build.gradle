plugins {
    id 'com.android.library' version '8.10.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.1.0'
    namespace 'com.innerfence.chargeapi'

    defaultConfig {
        minSdkVersion 30
        targetSdkVersion 36
    }
}
